<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Registrar Document Requests</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- EmailJS SDK -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
        (function() {
            emailjs.init("0mxhMsjxyYfnnhBIn");
        })();
    </script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen p-4 sm:p-8">

    <div class="max-w-6xl mx-auto space-y-6">
        
        <!-- HEADER -->
        <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b border-slate-800 pb-5 gap-4">
            <div>
                <h1 class="text-xl font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-user-shield text-blue-500"></i> Registrar Admin Portal
                </h1>
                <p class="text-xs text-slate-400 mt-1">Manage student document applications and send real-time email status updates.</p>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="addDemoData()" class="px-3.5 py-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-xl text-xs font-semibold text-slate-300 transition">
                    <i class="fa-solid fa-plus mr-1"></i> Add Sample Data
                </button>
                <button onclick="loadDashboard()" class="px-3.5 py-2 bg-blue-600 hover:bg-blue-500 rounded-xl text-xs font-semibold text-white transition shadow-lg shadow-blue-600/30">
                    <i class="fa-solid fa-rotate-right mr-1"></i> Refresh Data
                </button>
            </div>
        </header>

        <!-- DASHBOARD STATS CARDS -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl flex items-center justify-between">
                <div>
                    <span class="text-[11px] font-bold text-slate-400 uppercase tracking-wider block">Total Requests</span>
                    <span id="stat-total" class="text-2xl font-extrabold text-white mt-1 block">0</span>
                </div>
                <div class="w-10 h-10 rounded-xl bg-blue-500/10 text-blue-400 border border-blue-500/20 flex items-center justify-center">
                    <i class="fa-solid fa-folder-open text-base"></i>
                </div>
            </div>

            <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl flex items-center justify-between">
                <div>
                    <span class="text-[11px] font-bold text-amber-400 uppercase tracking-wider block">Pending</span>
                    <span id="stat-pending" class="text-2xl font-extrabold text-amber-400 mt-1 block">0</span>
                </div>
                <div class="w-10 h-10 rounded-xl bg-amber-500/10 text-amber-400 border border-amber-500/20 flex items-center justify-center">
                    <i class="fa-solid fa-clock text-base"></i>
                </div>
            </div>

            <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl flex items-center justify-between">
                <div>
                    <span class="text-[11px] font-bold text-indigo-400 uppercase tracking-wider block">Processing</span>
                    <span id="stat-processing" class="text-2xl font-extrabold text-indigo-400 mt-1 block">0</span>
                </div>
                <div class="w-10 h-10 rounded-xl bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 flex items-center justify-center">
                    <i class="fa-solid fa-spinner text-base"></i>
                </div>
            </div>

            <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl flex items-center justify-between">
                <div>
                    <span class="text-[11px] font-bold text-emerald-400 uppercase tracking-wider block">Ready / Done</span>
                    <span id="stat-ready" class="text-2xl font-extrabold text-emerald-400 mt-1 block">0</span>
                </div>
                <div class="w-10 h-10 rounded-xl bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 flex items-center justify-center">
                    <i class="fa-solid fa-circle-check text-base"></i>
                </div>
            </div>
        </div>

        <!-- TABLE DATA -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 sm:p-6 shadow-xl">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-sm font-bold text-white uppercase tracking-wider flex items-center gap-2">
                    <i class="fa-solid fa-list-check text-blue-400"></i> Applications List
                </h2>
            </div>
            
            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs text-slate-300">
                    <thead class="bg-slate-950 text-slate-400 uppercase text-[10px] tracking-wider border-b border-slate-800">
                        <tr>
                            <th class="p-3">Ref Code</th>
                            <th class="p-3">Student Info</th>
                            <th class="p-3">Document</th>
                            <th class="p-3">Method</th>
                            <th class="p-3">GCash Ref</th>
                            <th class="p-3">Current Status</th>
                            <th class="p-3 text-right">Update Status</th>
                        </tr>
                    </thead>
                    <tbody id="adminTableBody" class="divide-y divide-slate-800">
                        <!-- Dynamic Rows -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const DOCUMENT_TYPES = [
            { id: 'tor', name: 'Transcript of Records (TOR)' },
            { id: 'cert_grad', name: 'Certificate of Graduation' },
            { id: 'cert_enroll', name: 'Certificate of Enrollment' },
            { id: 'good_moral', name: 'Certificate of Good Moral' },
            { id: 'diploma_dup', name: 'Diploma (Duplicate Copy)' },
            { id: 'form137', name: 'Form 137 / SF10' }
        ];

        function loadDashboard() {
            const requests = JSON.parse(localStorage.getItem('doc_requests') || '[]');
            const tbody = document.getElementById('adminTableBody');
            tbody.innerHTML = '';

            // Update Stats
            let pendingCount = 0;
            let processingCount = 0;
            let readyCount = 0;

            requests.forEach(r => {
                if (r.status === 'PENDING') pendingCount++;
                else if (r.status === 'PROCESSING') processingCount++;
                else if (r.status === 'READY' || r.status === 'COMPLETED') readyCount++;
            });

            document.getElementById('stat-total').innerText = requests.length;
            document.getElementById('stat-pending').innerText = pendingCount;
            document.getElementById('stat-processing').innerText = processingCount;
            document.getElementById('stat-ready').innerText = readyCount;

            if (requests.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="7" class="p-8 text-center text-slate-500">
                            <i class="fa-solid fa-inbox text-3xl mb-2 block"></i>
                            No document requests found. Submit a request in <code class="text-blue-400">index.html</code> or click "Add Sample Data".
                        </td>
                    </tr>`;
                return;
            }

            [...requests].reverse().forEach(req => {
                const docObj = DOCUMENT_TYPES.find(d => d.id === req.docType);
                const docName = docObj ? docObj.name : req.docType;

                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-950/50 transition";
                tr.innerHTML = `
                    <td class="p-3 font-mono text-blue-400 font-bold">${req.refCode}</td>
                    <td class="p-3">
                        <span class="font-bold text-white block">${req.fullName}</span>
                        <span class="text-[10px] text-slate-400">${req.studentId} | ${req.email}</span>
                    </td>
                    <td class="p-3">${docName}</td>
                    <td class="p-3">
                        <span class="px-2 py-1 rounded-md text-[10px] font-bold ${req.claimMethod === 'DELIVERY' ? 'bg-purple-500/10 text-purple-400 border border-purple-500/20' : 'bg-slate-800 text-slate-300'}">
                            ${req.claimMethod}
                        </span>
                    </td>
                    <td class="p-3 font-mono">${req.gcashRef}</td>
                    <td class="p-3">
                        <span class="px-2.5 py-1 rounded-full text-[10px] font-extrabold uppercase ${
                            req.status === 'READY' || req.status === 'COMPLETED' ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' :
                            req.status === 'PROCESSING' ? 'bg-indigo-500/10 text-indigo-400 border border-indigo-500/20' :
                            'bg-amber-500/10 text-amber-400 border border-amber-500/20'
                        }">
                            ${req.status}
                        </span>
                    </td>
                    <td class="p-3 text-right">
                        <select onchange="updateStatus('${req.refCode}', this.value)" class="bg-slate-950 border border-slate-700 text-white text-[11px] rounded-lg px-2 py-1 outline-none focus:border-blue-500">
                            <option value="">-- Change Status --</option>
                            <option value="PENDING" ${req.status === 'PENDING' ? 'selected' : ''}>PENDING</option>
                            <option value="PROCESSING" ${req.status === 'PROCESSING' ? 'selected' : ''}>PROCESSING</option>
                            <option value="READY" ${req.status === 'READY' ? 'selected' : ''}>READY / OUT FOR DELIVERY</option>
                            <option value="COMPLETED" ${req.status === 'COMPLETED' ? 'selected' : ''}>COMPLETED</option>
                        </select>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function updateStatus(refCode, newStatus) {
            if (!newStatus) return;

            let requests = JSON.parse(localStorage.getItem('doc_requests') || '[]');
            const idx = requests.findIndex(r => r.refCode === refCode);

            if (idx !== -1) {
                requests[idx].status = newStatus;
                localStorage.setItem('doc_requests', JSON.stringify(requests));

                const req = requests[idx];
                const docObj = DOCUMENT_TYPES.find(d => d.id === req.docType);
                const docName = docObj ? docObj.name : req.docType;

                // AUTOMATIC EMAIL NOTIFICATION VIA EMAILJS
                emailjs.send("service_gwymlqw", "template_kx4ylfq", {
                    to_name: req.fullName,
                    to_email: req.email,
                    ref_code: req.refCode,
                    doc_name: docName,
                    status: newStatus,
                    claim_method: req.claimMethod,
                    delivery_address: req.deliveryAddress
                }).then(() => {
                    alert(`Status updated to "${newStatus}" and email notification sent to ${req.email}!`);
                }, (err) => {
                    alert(`Status updated to "${newStatus}", but failed to send email. Check browser console.`);
                    console.error('EmailJS Error:', err);
                });

                loadDashboard();
            }
        }

        function addDemoData() {
            const demoRequests = [
                {
                    refCode: 'DOC-2026-1001',
                    studentId: '2026-0001',
                    fullName: 'Juan Dela Cruz',
                    email: 'juan.delacruz@example.com',
                    docType: 'tor',
                    claimMethod: 'PICKUP',
                    deliveryAddress: 'N/A (School Pick-up)',
                    gcashRef: '1029384756101',
                    status: 'PENDING'
                },
                {
                    refCode: 'DOC-2026-1002',
                    studentId: '2026-0002',
                    fullName: 'Maria Santos',
                    email: 'maria.santos@example.com',
                    docType: 'good_moral',
                    claimMethod: 'DELIVERY',
                    deliveryAddress: 'Block 1 Lot 2, San Jose, Laguna',
                    gcashRef: '1029384756102',
                    status: 'PROCESSING'
                }
            ];
            localStorage.setItem('doc_requests', JSON.stringify(demoRequests));
            loadDashboard();
        }

        window.onload = loadDashboard;
    </script>
</body>
</html>
