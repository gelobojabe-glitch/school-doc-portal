<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Admin Portal - Edulink Solutions</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- SUPABASE CLIENT JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { brand: { 50: '#eff6ff', 100: '#dbeafe', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8', 900: '#0f172a' } }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen">

    <!-- LOGIN SCREEN -->
    <div id="loginSection" class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-slate-800/90 backdrop-blur-md border border-slate-700/80 rounded-2xl p-8 max-w-md w-full space-y-6 shadow-2xl relative overflow-hidden">
            <div class="text-center space-y-2">
                <i class="fa-solid fa-shield-halved text-4xl text-blue-500"></i>
                <h2 class="text-xl font-bold tracking-tight text-white">Registrar Admin Access</h2>
            </div>
            <input type="password" id="adminPass" placeholder="••••••••" class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-sm text-white outline-none focus:border-blue-500">
            <button onclick="loginAdmin()" class="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs uppercase rounded-xl transition shadow-lg">Unlock Dashboard</button>
        </div>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="dashboardSection" class="hidden min-h-screen bg-slate-950 text-slate-100 flex flex-col">
        <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-30">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3.5 flex justify-between items-center">
                <h1 class="font-bold text-base text-white">Registrar Control Center</h1>
                <button onclick="logoutAdmin()" class="px-3.5 py-2 bg-slate-800 text-slate-300 text-xs font-semibold rounded-lg border border-slate-700">Logout</button>
            </div>
        </header>

        <main class="max-w-7xl mx-auto px-4 sm:px-6 py-8 w-full flex-1 space-y-6">
            <div class="grid grid-cols-2 md:grid-cols-5 gap-4">
                <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl"><span class="text-xs text-slate-400 font-medium">Total Requests</span><div class="text-2xl font-bold text-white mt-1" id="statTotal">0</div></div>
                <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl"><span class="text-xs text-slate-400 font-medium">Pending Review</span><div class="text-2xl font-bold text-amber-400 mt-1" id="statPending">0</div></div>
                <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl"><span class="text-xs text-slate-400 font-medium">For Delivery</span><div class="text-2xl font-bold text-indigo-400 mt-1" id="statDelivery">0</div></div>
                <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl"><span class="text-xs text-slate-400 font-medium">Ready / Done</span><div class="text-2xl font-bold text-emerald-400 mt-1" id="statReady">0</div></div>
                <div class="col-span-2 md:col-span-1 bg-gradient-to-br from-blue-900/40 to-slate-900 border border-blue-500/30 p-4 rounded-2xl"><span class="text-xs text-blue-300 font-medium">Total Revenue</span><div class="text-2xl font-bold text-blue-200 mt-1" id="statRevenue">₱0.00</div></div>
            </div>

            <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden">
                <div class="p-4 border-b border-slate-800 flex justify-between">
                    <input type="text" id="searchInput" onkeyup="filterData()" placeholder="Search Student ID, Name, or Ref Code..." class="px-4 py-2 bg-slate-950 border border-slate-700 rounded-xl text-xs text-slate-200 outline-none max-w-md w-full">
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-xs">
                        <thead>
                            <tr class="bg-slate-950/80 text-slate-400 border-b border-slate-800 uppercase font-semibold">
                                <th class="py-3.5 px-4">Ref Code</th>
                                <th class="py-3.5 px-4">Student Details</th>
                                <th class="py-3.5 px-4">Document</th>
                                <th class="py-3.5 px-4">Method</th>
                                <th class="py-3.5 px-4">GCash Ref</th>
                                <th class="py-3.5 px-4">Status</th>
                                <th class="py-3.5 px-4 text-center">Manage</th>
                            </tr>
                        </thead>
                        <tbody id="adminTableBody" class="divide-y divide-slate-800/60"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script>
        // SUPABASE CONFIGURATION
        const SUPABASE_URL = "https://your-project.supabase.co";
        const SUPABASE_KEY = "your-anon-key";
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const DOCUMENT_TYPES = {
            'tor': { name: 'Transcript of Records (TOR)', price: 300 },
            'cert_grad': { name: 'Certificate of Graduation', price: 150 },
            'cert_enroll': { name: 'Certificate of Enrollment', price: 100 },
            'good_moral': { name: 'Certificate of Good Moral', price: 150 },
            'diploma_dup': { name: 'Diploma (Duplicate Copy)', price: 500 },
            'form137': { name: 'Form 137 / SF10', price: 200 }
        };

        let globalRequests = [];

        function loginAdmin() {
            if (document.getElementById('adminPass').value === 'admin123') {
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('dashboardSection').classList.remove('hidden');
                loadDashboardRealtime();
            } else { alert('Incorrect Security Code!'); }
        }

        function logoutAdmin() {
            document.getElementById('adminPass').value = '';
            document.getElementById('dashboardSection').classList.add('hidden');
            document.getElementById('loginSection').classList.remove('hidden');
        }

        // REALTIME SYNC SUPABASE LISTENER
        function loadDashboardRealtime() {
            fetchData();
            _supabase.channel('custom-all-channel')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'doc_requests' }, () => {
                fetchData();
            }).subscribe();
        }

        async function fetchData() {
            const { data, error } = await _supabase.from('doc_requests').select('*').order('id', { ascending: false });
            if (data) {
                globalRequests = data;
                document.getElementById('statTotal').innerText = globalRequests.length;
                document.getElementById('statPending').innerText = globalRequests.filter(r => r.status === 'PENDING').length;
                document.getElementById('statDelivery').innerText = globalRequests.filter(r => r.claimMethod === 'DELIVERY').length;
                document.getElementById('statReady').innerText = globalRequests.filter(r => r.status === 'READY' || r.status === 'COMPLETED').length;

                let totalRev = globalRequests.reduce((acc, r) => {
                    const doc = DOCUMENT_TYPES[r.docType];
                    let base = doc ? doc.price : 0;
                    if (r.claimMethod === 'DELIVERY') base += 150;
                    return acc + base;
                }, 0);
                document.getElementById('statRevenue').innerText = `₱${totalRev.toFixed(2)}`;

                filterData();
            }
        }

        function filterData() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = globalRequests.filter(r => (r.refCode || '').toLowerCase().includes(query) || (r.fullName || '').toLowerCase().includes(query) || (r.studentId || '').toLowerCase().includes(query));
            renderTable(filtered);
        }

        function renderTable(data) {
            const tbody = document.getElementById('adminTableBody');
            if (data.length === 0) { tbody.innerHTML = `<tr><td colspan="7" class="py-8 text-center text-slate-500">No requests found.</td></tr>`; return; }

            tbody.innerHTML = data.map((r) => {
                const docInfo = DOCUMENT_TYPES[r.docType] || { name: r.docType, price: 0 };
                const totalPrice = docInfo.price + (r.claimMethod === 'DELIVERY' ? 150 : 0);
                return `
                    <tr class="hover:bg-slate-900/50 transition">
                        <td class="py-3 px-4 font-mono font-bold text-blue-400">${r.refCode}</td>
                        <td class="py-3 px-4"><div class="font-semibold text-white">${r.fullName}</div><div class="text-[10px] text-slate-400">ID: ${r.studentId}</div></td>
                        <td class="py-3 px-4"><div class="text-slate-200">${docInfo.name}</div><div class="text-[10px] text-blue-400 font-bold">₱${totalPrice}.00</div></td>
                        <td class="py-3 px-4">${r.claimMethod === 'DELIVERY' ? '🚚 Delivery' : '🏫 Pick-up'}</td>
                        <td class="py-3 px-4 font-mono text-[11px]">${r.gcashRef}</td>
                        <td class="py-3 px-4"><span class="px-2 py-0.5 text-[10px] font-bold rounded-full bg-amber-500/10 text-amber-400">${r.status}</span></td>
                        <td class="py-3 px-4 text-center">
                            <select onchange="updateStatus('${r.refCode}', this.value)" class="bg-slate-950 border border-slate-700 text-xs text-slate-200 rounded p-1">
                                <option value="PENDING" ${r.status==='PENDING'?'selected':''}>Pending</option>
                                <option value="PROCESSING" ${r.status==='PROCESSING'?'selected':''}>Processing</option>
                                <option value="READY" ${r.status==='READY'?'selected':''}>Ready</option>
                                <option value="COMPLETED" ${r.status==='COMPLETED'?'selected':''}>Completed</option>
                            </select>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        async function updateStatus(refCode, newStatus) {
            await _supabase.from('doc_requests').update({ status: newStatus }).eq('refCode', refCode);
        }
    </script>
</body>
</html>
